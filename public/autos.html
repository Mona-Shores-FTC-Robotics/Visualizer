<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Strategy</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
/* Every biobuzz Auto on master, as an animation with its switches: flip a TIP or an INIT choice
   and the animation shows that match. The cards, switches and GIFs come from
   autos/manifest.json, written by scripts/make-auto-gifs.mjs. Each animation is an MP4 (tap to
   pause, drag to seek, 3x or real time), with its GIF as the fallback. */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#15181d; --muted:#5d6470; --line:#dcdfe5;
  --accent:#2f6fde; --accent-ink:#ffffff; --seg:#eceff4; --seg-on:#ffffff; --seg-on-ink:#15181d;
  --tag:#e8f0fd; --tag-ink:#1f4fa8; --trial:#fbe9cf; --trial-ink:#8a5a12; --fb:#ece7fb; --fb-ink:#5a3fb0;
  --field:#2b2b2b; --warn-bg:#fde8e4; --warn-ink:#a3220e; --warn-line:#f2b8ad; --warn-dot:#d9381e;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --panel:#1a1e24; --ink:#e8ebf0; --muted:#9aa2ae; --line:#2c323b;
  --accent:#6ea0ff; --accent-ink:#0d1117; --seg:#11151a; --seg-on:#2c3440; --seg-on-ink:#ffffff;
  --tag:#1c2638; --tag-ink:#9cc0ff; --trial:#33291a; --trial-ink:#f0c47a; --fb:#251f38; --fb-ink:#c4b3ff;
  --warn-bg:#3a1a14; --warn-ink:#ffb4a3; --warn-line:#6b2a1e; --warn-dot:#ff7a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#1a1e24; --ink:#e8ebf0; --muted:#9aa2ae; --line:#2c323b;
  --accent:#6ea0ff; --accent-ink:#0d1117; --seg:#11151a; --seg-on:#2c3440; --seg-on-ink:#ffffff;
  --tag:#1c2638; --tag-ink:#9cc0ff; --trial:#33291a; --trial-ink:#f0c47a; --fb:#251f38; --fb-ink:#c4b3ff;
  --warn-bg:#3a1a14; --warn-ink:#ffb4a3; --warn-line:#6b2a1e; --warn-dot:#ff7a5c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;justify-content:space-between}
h1{margin:0;font-size:clamp(26px,4vw,34px);letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.open-vis{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.open-vis:hover{text-decoration:underline}
section{display:grid;gap:14px}
section > h2{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
/* Wide: the GIF at up to 720 px beside its controls; narrow: one column, the GIF full width. */
.card{container-type:inline-size}
.body{display:grid;grid-template-columns:minmax(0,1fr)}
@container (min-width:940px){
  .body{grid-template-columns:minmax(0,720px) minmax(0,1fr);align-items:start}
  .body .side{border-left:1px solid var(--line);min-height:100%}
}
.side{display:flex;flex-direction:column;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;overflow:clip;display:flex;flex-direction:column;min-width:0;scroll-margin-top:12px}
/* The view buttons sit above the animation, and the two move together. */
.stage{display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.viewbar{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:0 16px 10px}
.viewbar > span{font-size:13px;font-weight:700;color:var(--muted)}
.seg button .key{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:3px}
.mini{display:none}
/* One column on a phone: the animation and its view buttons stay on screen while that card's
   switches scroll under them, so a flip is seen as it is made; a slim line under the animation
   repeats the result. Only on a screen tall enough to leave room for the switches. */
@container (max-width:939.98px){@media (min-height:620px){
  .stage{position:sticky;top:0;z-index:2;box-shadow:0 6px 10px -8px rgba(0,0,0,.35)}
  .mini{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:6px 16px;font-size:13px;line-height:1.3;border-bottom:1px solid var(--line)}
  .mini b{font-size:15px}
  .mini .warn{color:var(--warn-ink);font-weight:700}
}}
.top{display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap;padding:14px 16px 10px}
.top h3{margin:0;font-size:19px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--tag);color:var(--tag-ink)}
.tag.trial{background:var(--trial);color:var(--trial-ink)}
.tag.fallback{background:var(--fb);color:var(--fb-ink)}
.use{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}
.shot{display:block;position:relative;aspect-ratio:1/1;background:var(--field);cursor:pointer;-webkit-tap-highlight-color:transparent}
.shot video,.shot img{display:block;width:100%;height:100%;object-fit:cover}
.shot:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* Paused: a small tag in the field's corner, clear of the clock in the middle. */
.big-play{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font-size:13px;font-weight:700;opacity:0;transition:opacity .15s;pointer-events:none}
.big-play svg{width:12px;height:12px;fill:#fff}
.shot.paused .big-play{opacity:1}
/* One slim row under the field: play/pause, where in the match, and the speed: 3x, or real time. */
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line)}
.player button{font:inherit;font-size:13px;font-weight:700;min-width:40px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--seg);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.player button svg{width:14px;height:14px;fill:currentColor}
.player .speed[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.player button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.player input{width:100%;margin:0;accent-color:var(--accent);height:28px}
@media (pointer:coarse){.player button{height:38px;min-width:46px}}
.result{display:grid;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.result .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.result .count{font-size:24px;font-weight:800;line-height:1.1;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;line-height:1.3;padding:2px 9px;border-radius:999px;background:var(--seg);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.late{background:var(--trial);color:var(--trial-ink);border-color:transparent;white-space:normal}
.chip.best{background:var(--tag);color:var(--tag-ink);border-color:transparent;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.result .robots{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.result .robot{display:inline-flex;align-items:center;gap:7px}
.result .robot .key{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--muted)}
.result .robot b{font-weight:800}
.result .robot.warn{color:var(--warn-ink)}
.result .fallback{margin:0;font-size:12.5px;color:var(--muted)}
.contact{display:inline-block;font-weight:700;font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);white-space:nowrap}
.quiet{color:var(--muted)}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn-dot);vertical-align:1px}
.seg button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn-dot);margin-left:6px;vertical-align:1px}
.seg button .dot[hidden]{display:none}
.switches{display:grid;gap:0;padding:2px 16px 4px}
.sw{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:10px;padding:3px 0}
.sw > span{font-size:13px;font-weight:700;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--seg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;min-width:0}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:6px;padding:6px 8px;background:transparent;color:var(--muted);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.seg button.off[aria-pressed="true"]{background:#c9472f;color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:480px){.sw:not(.alliance){grid-template-columns:6.2em 1fr;gap:8px}.sw > span{font-size:12.5px;line-height:1.2}.seg button{white-space:normal;line-height:1.2}}
/* A finger, not a mouse: every button at least 40 px tall. */
@media (pointer:coarse){.seg button{min-height:40px;font-size:14px}.btn{min-height:44px}}
/* Pairs, then solo Autos, spaced as one list of cards. */
#solo{margin-top:-16px}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.jump a{padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.jump a:hover{border-color:var(--accent)}
.jump a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:38px;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;background:var(--seg);color:var(--ink);border:1px solid var(--line)}
.btn.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:13px}
.brand{display:block}
.brand .logo{display:block;width:min(100%,420px);height:auto;background:#fff;border-radius:12px;padding:10px 16px;box-sizing:border-box;margin-bottom:12px}
.brand h1{margin:0;font-size:clamp(28px,5vw,40px);letter-spacing:-.01em}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titlebar h1{min-width:0;white-space:nowrap;font-size:clamp(24px,7vw,40px)}
.alliance{display:block;flex:none;width:min(10em,42%);padding:0}
.alliance button[data-alliance="red"][aria-pressed="true"]{background:#c62828;color:#fff}
.alliance button[data-alliance="blue"][aria-pressed="true"]{background:#1f5fd6;color:#fff}
.seg.three{grid-template-columns:repeat(3,1fr)}
.group{display:grid;gap:8px;padding:10px 0 4px}
.group + .group{border-top:1px solid var(--line)}
.group h4{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.group h4 .key{display:inline-block;width:22px;height:4px;border-radius:2px}
.group h4 small{font-weight:600;letter-spacing:0;text-transform:none}
.beside{margin:12px 0 0;color:var(--muted);font-size:14px}
.beside a{color:var(--accent);font-weight:700;text-decoration:none}
.beside a:hover{text-decoration:underline}
.ds{flex-basis:100%;margin:0;color:var(--muted);font-size:12px;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
<header class="brand">
  <img class="logo" src="autos/mona-shores-logo.svg" alt="Mona Shores Ultraviolet 20245 and Infrared 19429" width="439" height="113">
  <div class="titlebar">
    <h1>Auto Strategy</h1>
    <div class="sw alliance" role="group" aria-label="Alliance">
      <div class="seg"><button type="button" data-alliance="red" aria-pressed="true">Red</button><button type="button" data-alliance="blue" aria-pressed="false">Blue</button></div>
    </div>
  </div>
  <p class="beside"><a href="partner.html">Try an Auto beside any partner →</a> pick a stand-in or draw the partner's path with a finger, and see whether they touch.</p>
  <nav class="jump" id="jump" aria-label="Jump to an Auto"></nav>
</header>

<section id="pair" aria-label="Pairs"><div class="grid"></div></section>
<section id="solo" aria-label="Solo Autos"><div class="grid"></div></section>
</div>

<script>
const T = p => "./#team=master/" + p;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const ROBOT = f => f.replace(/^.*\//, "").replace(/\.pp$/, "").replace(/(^|-)([a-z])/g, (_, d, c) => d + c.toUpperCase());
const VIEWS = [["both", "Both"], ["r", "R"], ["l", "L"]];
/** Red or Blue for every card, remembered in this browser. */
let alliance = "red";
try { if (localStorage.getItem("autos-alliance") === "blue") alliance = "blue"; } catch (e) {}
const shows = [];
function setAlliance(a) {
  alliance = a;
  try { localStorage.setItem("autos-alliance", a); } catch (e) {}
  document.querySelectorAll("button[data-alliance]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.alliance === a)));
  shows.forEach(f => f());
}
document.querySelector(".alliance").addEventListener("click", e => {
  const b = e.target.closest("button[data-alliance]");
  if (b) setAlliance(b.dataset.alliance);
});
setAlliance(alliance);
const preloaded = new Set();
/** Warms the browser's cache with a video a flip may show next (they are about 100 KB each). */
function preload(src) { if (!preloaded.has(src)) { preloaded.add(src); fetch(src).catch(() => {}); } }
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3.2v11H3.5zM9.3 2.5h3.2v11H9.3z"/></svg>';
/** A card's video plays only while it is on screen; it loads when it first comes near. */
const onScreen = new IntersectionObserver(entries => entries.forEach(e => e.target.__seen?.(e.isIntersecting)),
  { rootMargin: "200px 0px" });

/**
 * The result panel: the TIPs that count (a big number, each TIP's settle time as a chip; one that
 * settles after 30 s still counts, by the team's rule), each robot's park in its path colour, and
 * the contact chip. The switches say what was picked, so it does not repeat them.
 */
function resultHtml(card, sc) {
  const n = sc.tips.length;
  const pair = card.files.length > 1;
  const tips = sc.tips.map((t, i) => t.settled > 30
    ? `<span class="chip late">TIP ${i + 1} ${t.settled.toFixed(1)} s · after AUTO, counts</span>`
    : `<span class="chip">TIP ${i + 1} ${t.settled.toFixed(1)} s</span>`).join("");
  const robots = sc.robots.map(r => {
    const letter = r.robot.toUpperCase();
    const color = card.colors?.[r.robot];
    const key = `<span class="key"${color ? ` style="background:${esc(color)}"` : ""} aria-hidden="true"></span>`;
    return r.parked == null
      ? `<span class="robot warn">${key}<b>${letter}</b> not parked${r.why && r.why !== "not parked" ? ` (${esc(r.why)})` : ""}</span>`
      : `<span class="robot">${key}<b>${letter}</b> parked ${r.parked.toFixed(1)} s${r.parkedBy === "guard" ? " (by the guard)" : ""}</span>`;
  }).join("");
  const contact = !pair ? ""
    : sc.contact != null
      ? `<span class="contact">⚠ Contact ${Number(sc.contact).toFixed(1)} s</span>`
      : `<span class="chip quiet">No contact</span>`;
  return `<div class="head"><span class="count">${n} TIP${n === 1 ? "" : "s"}</span>${pair ? "" : `<span class="chip quiet">this robot's own</span>`}${sc.best ? `<span class="chip best">Best case</span>` : ""}${tips}</div>
    <div class="robots">${robots}${contact ? `<span class="robot">${contact}</span>` : ""}</div>
    ${sc.note ? `<p class="fallback">${esc(sc.note)}.</p>` : ""}`;
}

/** The one line under a pinned animation: the TIP count, any robot not parked, and contact. */
function miniHtml(card, sc) {
  const n = sc.tips.length;
  const parts = [`<b>${n} TIP${n === 1 ? "" : "s"}</b>`];
  for (const r of sc.robots) if (r.parked == null) parts.push(`<span class="warn">${r.robot.toUpperCase()} not parked</span>`);
  if (card.files.length > 1) parts.push(sc.contact != null
    ? `<span class="warn">⚠ Contact ${Number(sc.contact).toFixed(1)} s</span>` : `<span class="quiet">No contact</span>`);
  return parts.join("");
}

function renderCard(card) {
  const el = document.createElement("article");
  el.className = "card";
  const pair = card.files.length > 1;
  const tagClass = card.tag === "Trial" ? " trial" : card.tag === "Fallback" ? " fallback" : "";
  const halves = card.files.length > 1
    ? card.files.map((f, i) => `<a class="btn" href="${T(f)}">${esc(card.halves?.[i] ?? ROBOT(f))}</a>`).join("") : "";
  // A switch's buttons; `options` are its owner's own words for the two legs.
  const seg = (s, i, options = s.options) => `
        <div class="seg">${options.map((o, j) =>
          `<button type="button" data-i="${i}" data-j="${j}" class="${j && s.kind === "tip" ? "off" : ""}" aria-pressed="${j === 0}">${esc(o)}<span class="dot" hidden title="Touches the partner here"></span></button>`).join("")}</div>`;
  const row = (label, inner, extra = "") =>
    `<div class="sw${extra}" role="group" aria-label="${esc(label)}"><span>${esc(label)}</span>${inner}</div>`;
  const tipNumber = (s) => Number(s.label.match(/\d+/)?.[0] ?? 0);
  const tips = card.switches.map((s, i) => [s, i]).filter(([s]) => s.kind === "tip")
    .sort(([a], [b]) => tipNumber(a) - tipNumber(b));
  const choicesOf = (robot) => card.switches.map((s, i) => [s, i])
    .filter(([s]) => s.kind === "choice" && (s.owners ?? [{ robot: "r" }]).some(o => o.robot === robot));
  const optionsOf = (s, robot) => (s.owners ?? []).find(o => o.robot === robot)?.options ?? s.options;
  // Pair: the match's TIPs, the view, then each robot's own INIT choices under its Auto's name and
  // path colour (a robot with no choices has no group). Solo: one group.
  const robotGroup = (robot, k, where) => {
    const list = choicesOf(robot);
    if (!list.length) return "";
    const color = card.colors?.[robot];
    return `<div class="group" role="group" aria-label="${esc(card.halves[k])} INIT choices">
      <h4>${color ? `<span class="key" style="background:${esc(color)}" aria-hidden="true"></span>` : ""}${esc(card.halves[k]).replace(/-/g, "\u2011")} <small>(${where})</small></h4>
      ${list.map(([s, i]) => row(s.label, seg(s, i, optionsOf(s, robot)))).join("")}</div>`;
  };
  const controls = pair
    ? `<div class="group" role="group" aria-label="Match"><h4>Match</h4>${tips.map(([s, i]) => row(s.label, seg(s, i))).join("")}</div>
      ${robotGroup("r", 0, "near start")}${robotGroup("l", 1, "far start")}`
    : `<div class="group">${card.switches.map((s, i) => row(s.label, seg(s, i))).join("")}</div>`;
  // Pair: which robots the animation shows, above it; R and L carry their path colours.
  const viewbar = !pair ? "" : `<div class="viewbar" role="group" aria-label="Show"><span>Show</span><div class="seg three">${VIEWS.map(([v, label]) => {
      const color = card.colors?.[v];
      const key = color ? `<span class="key" style="background:${esc(color)}" aria-hidden="true"></span>` : "";
      const name = v === "both" ? "Both robots" : `Only ${card.halves?.[v === "r" ? 0 : 1] ?? label}`;
      return `<button type="button" data-view="${v}" aria-pressed="${v === "both"}" aria-label="${esc(name)}">${key}${esc(label)}</button>`;
    }).join("")}</div></div>`;
  el.id = "auto-" + card.name.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
  el.innerHTML = `
    <div class="top"><h3>${esc(card.name).replace(/-/g, "\u2011")}</h3>${card.tag ? `<span class="tag${tagClass}">${esc(card.tag)}</span>` : ""}</div>
    <div class="body">
      <div class="stage">${viewbar}
        <div class="shot" role="button" tabindex="0" aria-label="Pause or play ${esc(card.name)}">
          <video muted playsinline loop preload="none" disablepictureinpicture width="720" height="720"></video>
          <span class="big-play" aria-hidden="true">${PAUSE}Paused · tap to play</span></div>
        <div class="player">
          <button type="button" class="pp" aria-label="Pause">${PAUSE}</button>
          <input type="range" class="scrub" min="0" max="1000" step="1" value="0" aria-label="Match time">
          <button type="button" class="speed" aria-pressed="false" aria-label="Real time" title="Plays at 3× real time; tap for real time">3×</button>
        </div>
        <div class="mini" aria-hidden="true"></div>
      </div>
      <div class="side">
        <div class="result" aria-live="polite"></div>
        <div class="switches">${controls}</div>
        <div class="actions"><a class="btn primary" href="${T(card.files.join(","))}">${pair ? "Open the pair" : "Open"}</a>${halves}</div>
      </div>
    </div>`;
  const shot = el.querySelector(".shot");
  let video = el.querySelector("video");
  const pp = el.querySelector(".pp");
  const scrub = el.querySelector(".scrub");
  const speed = el.querySelector(".speed");
  const cap = el.querySelector(".result");
  const mini = el.querySelector(".mini");
  const state = card.switches.map(() => 0);
  let view = "both";
  const keyOf = st => st.join("") || "0";
  const src = (sc, v = view, a = alliance, ext = "mp4") => `autos/${sc.gif[v] ?? sc.gif.both}--${a}.${ext}`;
  // Playback: `wantPaused` is the viewer's own pause; `visible` is whether the card is near the
  // screen. A flip keeps the match time, the speed and the pause, so a switch is seen at the same
  // moment of the match.
  let wantPaused = false, visible = false, slow = false, gif = false;
  // The videos are made at 3× real time (scripts/make-auto-gifs.mjs, --speed 3): real time is a third.
  const rate = () => (slow ? 1 / 3 : 1);
  const syncUi = () => {
    const paused = gif ? false : video.paused;
    shot.classList.toggle("paused", paused && !gif);
    pp.innerHTML = paused ? PLAY : PAUSE;
    pp.setAttribute("aria-label", paused ? "Play" : "Pause");
    speed.setAttribute("aria-pressed", String(slow));
    speed.textContent = slow ? "1×" : "3×";
    speed.setAttribute("aria-label", slow ? "Playing at real time; tap for 3×" : "Playing at 3×; tap for real time");
  };
  const tick = () => {
    if (!gif && video.duration) scrub.value = String(Math.round((video.currentTime / video.duration) * 1000));
    if (!gif && !video.paused) requestAnimationFrame(tick);
  };
  const run = () => {
    if (gif) return;
    if (visible && !wantPaused) video.play().catch(() => { wantPaused = true; syncUi(); });
    else video.pause();
  };
  const load = (url) => {
    if (gif) { video.src = url.replace(/\.mp4$/, ".gif"); return; }
    if (video.getAttribute("src") === url) return;
    const t = video.currentTime || 0;
    video.setAttribute("src", url);
    video.addEventListener("loadedmetadata", () => {
      video.currentTime = Math.min(t, Math.max(0, video.duration - 0.05));
      video.defaultPlaybackRate = video.playbackRate = rate();
      tick(); run();
    }, { once: true });
    video.load();
  };
  // A phone that cannot play the video gets the GIF: it plays, but does not pause.
  video.addEventListener("error", () => {
    if (gif) return;
    gif = true;
    const img = document.createElement("img");
    img.alt = video.getAttribute("aria-label") ?? "";
    img.src = (video.getAttribute("src") ?? "").replace(/\.mp4$/, ".gif");
    video.replaceWith(img);
    video = img;
    el.querySelector(".player").hidden = true;
    syncUi();
  });
  video.addEventListener("play", () => { syncUi(); tick(); });
  video.addEventListener("pause", syncUi);
  const toggle = () => { wantPaused = !wantPaused; run(); syncUi(); };
  shot.addEventListener("click", toggle);
  shot.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
  pp.addEventListener("click", toggle);
  speed.addEventListener("click", () => { slow = !slow; video.defaultPlaybackRate = video.playbackRate = rate(); syncUi(); });
  scrub.addEventListener("input", () => { if (video.duration) video.currentTime = (+scrub.value / 1000) * video.duration; });
  const show = () => {
    const sc = card.scenarios[keyOf(state)];
    if (visible || video.getAttribute("src")) load(src(sc));
    video.setAttribute("aria-label", `${card.name}: ${sc.caption}`);
    cap.innerHTML = resultHtml(card, sc);
    mini.innerHTML = miniHtml(card, sc);
    // A dot on the pick that touches the partner with the other switches as they are.
    const warn = new Set(sc.warn ?? []);
    el.querySelectorAll("button[data-i]").forEach(b => {
      b.setAttribute("aria-pressed", String(state[+b.dataset.i] === +b.dataset.j));
      const risky = warn.has(`${b.dataset.i}:${b.dataset.j}`);
      b.querySelector(".dot").hidden = !risky;
      b.setAttribute("aria-label", b.firstChild.textContent + (risky ? " (touches the partner)" : ""));
      b.title = risky ? "With these settings, this pick touches the partner" : "";
    });
    el.querySelectorAll("button[data-view]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  };
  // Only the shown video loads; its one-flip neighbours (each switch, each view) load once a pointer
  // or the keyboard comes to the card, so the next flip swaps at once.
  const neighbours = () => {
    const sc = card.scenarios[keyOf(state)];
    state.forEach((_, i) => {
      const next = state.slice(); next[i] = 1 - next[i];
      const n = card.scenarios[keyOf(next)];
      if (n) preload(src(n));
    });
    if (pair) VIEWS.forEach(([v]) => preload(src(sc, v)));
  };
  el.addEventListener("pointerenter", neighbours);
  el.addEventListener("focusin", neighbours);
  el.querySelector(".body").addEventListener("click", e => {
    const v = e.target.closest("button[data-view]");
    if (v) view = v.dataset.view;
    const b = e.target.closest("button[data-i]");
    if (b) state[+b.dataset.i] = +b.dataset.j;
    if (v || b) { show(); neighbours(); }
  });
  show();
  shows.push(show);
  shot.__seen = (yes) => {
    visible = yes;
    if (yes && !video.getAttribute("src")) load(src(card.scenarios[keyOf(state)]));
    else run();
  };
  onScreen.observe(shot);
  syncUi();
  return el;
}

fetch("autos/manifest.json").then(r => r.json()).then(m => {
  const jump = document.getElementById("jump");
  for (const card of m.cards) {
    const el = renderCard(card);
    document.querySelector(`#${card.group} .grid`)?.appendChild(el);
    // A pair's two halves share a name: "R-Clockwise + L-Clockwise" is "Clockwise".
    const short = card.name.replace(/^R-(.+) \+ L-\1$/, "$1");
    jump.insertAdjacentHTML("beforeend", `<a href="#${el.id}">${esc(short)}</a>`);
  }
}).catch(e => {
  document.querySelector("#pair .grid").innerHTML = `<p class="note">Could not load the animations (${esc(e.message)}).</p>`;
});

</script>
</body>
</html>
