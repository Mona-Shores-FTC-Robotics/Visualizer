# Checks every pull request and every push to a branch other than main: types, lint, the unit
# tests and a production build, the same commands a contributor runs locally (`npm run check`,
# `npm run lint`, `npm test`, `npx vite build`). Pushes to main are built and tested by pages.yml.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types (svelte-check and tsc)
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
