# Checks every pull request: types, lint, the unit tests and a production build, the same
# commands a contributor runs locally (`npm run check`, `npm run lint`, `npm test`,
# `npx vite build`). Pushes to main are built and tested by pages.yml. A branch without a pull
# request can be checked by hand from the Actions tab (workflow_dispatch).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types (svelte-check and tsc)
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
